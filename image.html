<!DOCTYPE html>
<html>
<head>
    <title>Image Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

    <h1 style="color:rgb(50, 122, 205)">Image Object Detection</h1>

    <form method="POST" enctype="multipart/form-data">
        
        <input type="file" name="file"  required >
  
        <button type="submit">
            Detect Objects
        </button>

    </form>

    {% if output_image %}

        <img src="/{{ output_image }}" width="700">

    {% endif %}
</div>

</body>
</html>
