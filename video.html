<!DOCTYPE html>
<html>
<head>
    <title>Video Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1 style="color:rgb(50, 153, 205)">Video Object Detection</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <button type="submit">
            Detect Video
        </button>

    </form>

    {% if output_video %}

        <!--<video width="700" controls>
            <source src="/{{ output_video }}" type="video/mp4">
        </video>-->
       
        <video width="1200" controls autoplay>
            <source src="{{ url_for('static', filename=output_video) }}" type="video/mp4">
        </video>



    {% endif %}

</div>

</body>
</html>
